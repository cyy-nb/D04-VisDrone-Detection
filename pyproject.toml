[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d04-visdrone-detection"
version = "0.2.0"
description = "YOLOv8s-based VisDrone small-object detection experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
]

[project.optional-dependencies]
train = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pycocotools>=2.0.7",
    "torch>=2.1",
    "torchvision>=0.16",
    "ultralytics>=8.1",
]
dev = [
    "pytest>=8",
    "pyflakes>=3.2",
]

[tool.setuptools]
packages = ["script"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
